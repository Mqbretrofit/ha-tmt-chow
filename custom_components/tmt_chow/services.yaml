pedestrian_open:
  name: Pedestrian opening
  description: Open a supported TMT Chow gate to its configured pedestrian/partial position.
  fields:
    uuid:
      name: Gate UUID
      description: Internal UUID of the configured TMT Chow gate.
      required: true
      example: "00000000-0000-0000-0000-000000000000"
      selector:
        text:

ouranos_probe:
  name: OURANOS transport probe
  description: >-
    Run one APK-compatible read-only status request over ThroughTek IOTC/RDT
    for a controller identified by the vendor as uuid_type 1 (OURANOS), or the
    legacy verified PS19001 fallback. Verified PS19001 keeps READ STATUS; a
    vendor AutoProduct Proposal with uartVer V3.0 uses the read-only RS status
    request. It sends no gate, parameter-read, or parameter-write command. The
    PIN is used only for this action and is not saved.
  fields:
    uuid:
      name: Gate UUID
      description: >-
        Optional. Leave empty when exactly one configured OURANOS candidate exists.
      required: false
      example: "ABCDEFGHIJKLMNOPQRST"
      selector:
        text:
    pin_code:
      name: Gate PIN
      description: Six-digit PIN used by the TMT Chow app for this gate. It is not saved.
      required: true
      selector:
        text:
          type: password


ps25142_movement_test:
  name: PS25142 movement test
  description: >-
    Send exactly one hardware-test movement command to a verified PS25142 over
    its confirmed OURANOS/IOTC-RDT route. The command is never retried
    automatically. Open is allowed only from a fully closed/stopped gate, close
    only from a fully open/stopped gate, and stop only while Home Assistant
    currently reports movement. A read-only RS status refresh follows the
    one-shot movement command. Normal cover movement controls remain disabled.
  fields:
    uuid:
      name: Gate UUID
      description: >-
        Optional. Leave empty when exactly one verified PS25142 is configured.
      required: false
      example: "ABCDEFGHIJKLMNOPQRST"
      selector:
        text:
    action:
      name: Test action
      description: The single movement command to test.
      required: true
      selector:
        select:
          options:
            - label: Open
              value: open
            - label: Close
              value: close
            - label: Stop
              value: stop
    confirm:
      name: Confirm movement
      description: Must be enabled to send the selected physical gate command.
      required: true
      selector:
        boolean:
