pedestrian_open:
  name: Pedestrian opening
  description: Open a supported TMT Chow gate to its configured pedestrian/partial position.
  fields:
    uuid:
      name: Gate UUID
      description: Internal UUID of the configured TMT Chow gate.
      required: true
      example: "00000000-0000-0000-0000-000000000000"
      selector:
        text:

ouranos_probe:
  name: OURANOS transport probe
  description: >-
    Run one APK-compatible read-only status request over ThroughTek IOTC/RDT
    for the confirmed PS19001 OURANOS case. It sends no gate, parameter-read,
    or parameter-write command. The PIN is used only for this action and is not saved.
  fields:
    uuid:
      name: Gate UUID
      description: >-
        Optional. Leave empty when exactly one configured PS19001 OURANOS candidate exists.
      required: false
      example: "ABCDEFGHIJKLMNOPQRST"
      selector:
        text:
    pin_code:
      name: Gate PIN
      description: Six-digit PIN used by the TMT Chow app for this gate. It is not saved.
      required: true
      selector:
        text:
          type: password
