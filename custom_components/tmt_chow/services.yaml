pedestrian_open:
  name: Pedestrian opening
  description: Open a supported TMT Chow gate to its configured pedestrian/partial position.
  fields:
    uuid:
      name: Gate UUID
      description: Internal UUID of the configured TMT Chow gate.
      required: true
      example: "00000000-0000-0000-0000-000000000000"
      selector:
        text:

ouranos_probe:
  name: OURANOS transport probe
  description: >-
    Run a read-only ThroughTek IOTC/RDT connectivity probe inside Home Assistant
    for the confirmed PS19001 OURANOS case. It sends no gate, status-read,
    parameter-read, or parameter-write command.
  fields:
    uuid:
      name: Gate UUID
      description: >-
        Optional. Leave empty when exactly one configured PS19001 OURANOS candidate exists.
      required: false
      example: "ABCDEFGHIJKLMNOPQRST"
      selector:
        text:
