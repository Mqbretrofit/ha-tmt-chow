name: Restore brand assets

on:
  push:
    paths:
      - '.github/workflows/restore-brand.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild brand assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p custom_components/tmt_chow/brand
          cat .brandtmp/icon.part* | base64 -d > custom_components/tmt_chow/brand/icon.png
          echo 'f16122ca311e337c1972ac3c0297257cda0f69aca9f73c808f2c94269b1e6f30  custom_components/tmt_chow/brand/icon.png' | sha256sum -c -

          cp custom_components/tmt_chow/brand/icon.png custom_components/tmt_chow/brand/dark_icon.png

          if command -v magick >/dev/null 2>&1; then
            magick custom_components/tmt_chow/brand/icon.png -resize 512x512 custom_components/tmt_chow/brand/icon@2x.png
          elif command -v convert >/dev/null 2>&1; then
            convert custom_components/tmt_chow/brand/icon.png -resize 512x512 custom_components/tmt_chow/brand/icon@2x.png
          else
            cp custom_components/tmt_chow/brand/icon.png custom_components/tmt_chow/brand/icon@2x.png
          fi
          cp custom_components/tmt_chow/brand/icon@2x.png custom_components/tmt_chow/brand/dark_icon@2x.png

          file custom_components/tmt_chow/brand/*.png
          rm -rf .brandtmp
          rm -f .github/workflows/restore-brand.yml

      - name: Commit brand assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore TMT Chow brand assets"
          git push origin HEAD:main
