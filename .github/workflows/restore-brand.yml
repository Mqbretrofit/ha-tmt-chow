name: Restore brand assets

on:
  push:
    paths:
      - '.github/workflows/restore-brand.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download v1.0.0 release archive
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/tmt-chow-v1.0.0.zip \
            https://github.com/Mqbretrofit/ha-tmt-chow/releases/download/v1.0.0/tmt-chow-v1.0.0.zip
          rm -rf /tmp/tmt-release
          mkdir -p /tmp/tmt-release
          unzip -q /tmp/tmt-chow-v1.0.0.zip -d /tmp/tmt-release
          test -f /tmp/tmt-release/tmt_chow/brand/icon.png
          test -f /tmp/tmt-release/tmt_chow/brand/icon@2x.png
          test -f /tmp/tmt-release/tmt_chow/brand/dark_icon.png
          test -f /tmp/tmt-release/tmt_chow/brand/dark_icon@2x.png

      - name: Restore brand folder and remove one-shot workflow
        run: |
          set -euo pipefail
          rm -rf custom_components/tmt_chow/brand
          mkdir -p custom_components/tmt_chow
          cp -a /tmp/tmt-release/tmt_chow/brand custom_components/tmt_chow/brand
          rm -f .github/workflows/restore-brand.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore TMT Chow brand assets"
          git push origin HEAD:main
