name: Restore brand assets

on:
  push:
    paths:
      - '.github/workflows/restore-brand.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tooling
        run: python -m pip install --quiet pillow

      - name: Complete brand folder
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image
          p = 'custom_components/tmt_chow/brand/icon.png'
          im = Image.open(p)
          im.load()
          if im.format != 'PNG' or im.size != (256, 256):
              raise SystemExit(f'Unexpected icon: {im.format} {im.size}')
          im.resize((512, 512), Image.Resampling.LANCZOS).save('custom_components/tmt_chow/brand/icon@2x.png')
          PY
          cp custom_components/tmt_chow/brand/icon.png custom_components/tmt_chow/brand/dark_icon.png
          cp custom_components/tmt_chow/brand/icon@2x.png custom_components/tmt_chow/brand/dark_icon@2x.png
          rm -rf .brandtmp
          rm -f .github/workflows/restore-brand.yml

      - name: Commit brand assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore complete TMT Chow brand folder"
          git push origin HEAD:main
