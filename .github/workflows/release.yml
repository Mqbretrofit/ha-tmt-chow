name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "custom_components/tmt_chow/manifest.json"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read integration version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import json
          with open("custom_components/tmt_chow/manifest.json", encoding="utf-8") as f:
              print(json.load(f)["version"])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create source ZIP
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          zip -r "tmt_chow-${VERSION}.zip" custom_components/tmt_chow             -x "*/__pycache__/*" "*.pyc"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi

          gh release create "$TAG"             "tmt_chow-${VERSION}.zip"             --target "$GITHUB_SHA"             --title "TMT Chow $VERSION"             --notes "TMT Chow $VERSION

          - Multi-controller support
          - Per-model controller capabilities
          - Per-model parameter schemas and UART codecs
          - Home Assistant select and number entities
          - Mandatory read-back verification after parameter writes
          - PS21053 / PS21053C backward compatibility retained
          - product_type 112 and 118 handled independently"
