name: Delete withdrawn beta.41 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/delete-beta41-release.yml

permissions:
  contents: write

jobs:
  delete-withdrawn-release:
    runs-on: ubuntu-latest
    steps:
      - name: Delete v1.0.4-beta.41 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v1.0.4-beta.41 --repo "$REPO" >/dev/null 2>&1; then
            gh release delete v1.0.4-beta.41 --repo "$REPO" --yes
          fi
          if gh api "repos/$REPO/git/ref/tags/v1.0.4-beta.41" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$REPO/git/refs/tags/v1.0.4-beta.41"
          fi
